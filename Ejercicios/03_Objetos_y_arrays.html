<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datos del producto</title>
<style>
  body { font-family: Arial, sans-serif; background: #f1f1f1; margin: 0; padding: 30px 12px; }
  .tarjeta { background: #fff; max-width: 560px; margin: 0 auto; padding: 24px 28px; border-radius: 16px; }
  h1 { text-align: center; }
  label { display: block; margin: 14px 0 6px; font-size: 1.1em; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #888; border-radius: 4px; font-size: 1em; }
  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  button { padding: 14px; border: none; border-radius: 6px; color: #fff; background: #d9534f; font-size: 1em; cursor: pointer; }
  button.verde { background: #4caf50; }
  button:hover { opacity: 0.9; }
  #mensaje { margin-top: 18px; font-weight: bold; text-align: center; }
  .ok { color: #2e7d32; }
  .error { color: #c62828; }
  .tabla-contenedor { overflow-x: auto; margin-top: 18px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
  th { background: #333; color: #fff; }
</style>
</head>
<body>
<div class="tarjeta">
  <h1>Datos del producto</h1>

  <!-- Campos del producto: cada uno tiene un id para leer su valor desde JavaScript -->
  <label for="codigo">Código:</label>
  <input type="text" id="codigo">

  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre">

  <label for="precio">Precio:</label>
  <input type="number" id="precio" min="0" step="0.01">

  <label for="stock">Stock:</label>
  <input type="number" id="stock" min="0" step="1">

  <label for="proveedor">Proveedor:</label>
  <input type="text" id="proveedor">

  <!-- Botones: cada uno llama a una función definida en el script -->
  <div class="botones">
    <button class="verde" onclick="cargar()">Cargar</button>
    <button onclick="mostrar()">Mostrar</button>
    <button onclick="buscarPorNombre()">Buscar por nombre</button>
    <button onclick="cantidadProductos()">Cantidad de productos</button>
  </div>

  <!-- Zona donde se muestran mensajes y la tabla -->
  <div id="mensaje"></div>
  <div class="tabla-contenedor" id="resultado"></div>
</div>

<script>
/* ============================================================
   DATOS
   ============================================================ */

// Array de objetos: cada producto cargado es un objeto con las
// propiedades codigo, nombre, precio, stock y proveedor.
const productos = [];

/* ============================================================
   FUNCIONES AUXILIARES
   ============================================================ */

/**
 * Muestra un mensaje debajo de los botones.
 * @param {string} texto - mensaje a mostrar
 * @param {string} tipo  - "ok" (verde) o "error" (rojo)
 */
function mensaje(texto, tipo = "ok") {
  const div = document.getElementById("mensaje");
  div.textContent = texto;
  div.className = tipo;
}

/** Borra la tabla mostrada anteriormente. */
function limpiarTabla() {
  document.getElementById("resultado").innerHTML = "";
}

/* ============================================================
   BOTÓN "CARGAR": guarda un producto en el array de objetos
   ============================================================ */
function cargar() {
  // Se leen los valores de los campos. trim() quita espacios sobrantes.
  const codigo    = document.getElementById("codigo").value.trim();
  const nombre    = document.getElementById("nombre").value.trim();
  const precio    = document.getElementById("precio").value;
  const stock     = document.getElementById("stock").value;
  const proveedor = document.getElementById("proveedor").value.trim();

  // Validación: todos los campos deben estar completos
  if (!codigo || !nombre || precio === "" || stock === "" || !proveedor) {
    mensaje("Completa todos los campos antes de cargar.", "error");
    return;
  }

  // Se crea el objeto producto. Precio y stock se convierten a número.
  const producto = {
    codigo: codigo,
    nombre: nombre,
    precio: Number(precio),
    stock: Number(stock),
    proveedor: proveedor
  };

  productos.push(producto);   // se agrega al final del array
  mensaje("Producto cargado correctamente.");
  limpiarTabla();

  // Se limpian los campos y el foco vuelve al primero
  ["codigo", "nombre", "precio", "stock", "proveedor"].forEach(id => {
    document.getElementById(id).value = "";
  });
  document.getElementById("codigo").focus();
}

/* ============================================================
   BOTÓN "MOSTRAR": muestra todo lo cargado en una tabla
   ============================================================ */
function mostrar() {
  if (productos.length === 0) {
    limpiarTabla();
    mensaje("No hay productos cargados.", "error");
    return;
  }

  // Se arma el HTML de la tabla: encabezado + una fila por producto
  let html = `<table>
    <tr><th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Proveedor</th></tr>`;

  // for...of recorre cada objeto del array
  for (const p of productos) {
    html += `<tr>
      <td>${p.codigo}</td>
      <td>${p.nombre}</td>
      <td>$${p.precio}</td>
      <td>${p.stock}</td>
      <td>${p.proveedor}</td>
    </tr>`;
  }
  html += "</table>";

  document.getElementById("resultado").innerHTML = html;
  mensaje("");
}

/* ============================================================
   BOTÓN "BUSCAR POR NOMBRE": indica si el nombre fue encontrado
   Se usa el valor escrito en el campo "Nombre" como dato a buscar.
   ============================================================ */
function buscarPorNombre() {
  const buscado = document.getElementById("nombre").value.trim().toLowerCase();

  if (!buscado) {
    mensaje("Escribe un nombre en el campo Nombre para buscarlo.", "error");
    return;
  }

  // some() devuelve true si al menos un producto cumple la condición.
  // Se pasa todo a minúsculas para que no importe mayúsculas/minúsculas.
  const encontrado = productos.some(p => p.nombre.toLowerCase() === buscado);

  limpiarTabla();
  if (encontrado) mensaje("El valor buscado ha sido encontrado.", "ok");
  else            mensaje("El valor buscado no ha sido encontrado.", "error");
}

/* ============================================================
   BOTÓN "CANTIDAD DE PRODUCTOS": muestra cuántos hay cargados
   ============================================================ */
function cantidadProductos() {
  limpiarTabla();
  // length indica cuántos elementos tiene el array
  mensaje("Cantidad de productos cargados: " + productos.length);
}
</script>
</body>
</html>
